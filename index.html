<body>

<div class="app">

<h1>🎬 AI CARTOON MOVIE MAKER</h1>

<div class="sub">
Story → Scenes → Characters → Animation → Movie
</div>

<div class="card">

<label>📝 Paste Your Story</label>

<textarea id="story"
placeholder="अपनी पूरी कहानी यहाँ paste करें...

उदाहरण:
एक लड़का जंगल में जाता है। उसे एक कुत्ता मिलता है। अचानक बारिश शुरू होती है। दोनों एक पुराने घर की तरफ दौड़ते हैं।"></textarea>

<script>

const canvas=document.getElementById("movie");
const ctx=canvas.getContext("2d");

const storyBox=document.getElementById("story");
const language=document.getElementById("language");
const styleBox=document.getElementById("style");
const durationBox=document.getElementById("duration");
const voiceType=document.getElementById("voiceType");

const createBtn=document.getElementById("create");
const stopBtn=document.getElementById("stop");
const downloadBtn=document.getElementById("download");

const statusBox=document.getElementById("status");
const bar=document.getElementById("bar");
const scenesBox=document.getElementById("scenes");

let running=false;
let stopRequested=false;
let mediaRecorder=null;
let recordedChunks=[];
let audioCtx=null;

let movieCharacters=[];
let activeScene=0;


/* =========================
   STORY SCENE ENGINE
========================= */

function makeScenes(text){

  let parts=text
    .replace(/\r/g," ")
    .split(/[.!?।]+/)
    .map(x=>x.trim())
    .filter(Boolean);

  if(!parts.length)
    return [];

  return parts.slice(0,20);
}


/* =========================
   CHARACTER DETECTION
========================= */

function detectCharacters(text){

  const t=text.toLowerCase();

  const result={
    human:true,
    female:false,
    dog:false,
    cat:false,
    lion:false,
    bird:false,
    action:false,
    love:false,
    rain:false
  };

  if(
    /girl|woman|lady|लड़की|महिला|औरत|नारी|여자|女性/
    .test(t)
  ){
    result.female=true;
  }

  if(
    /dog|puppy|कुत्ता|कुत्ते|कुकुर|chien|perro|hund|犬|강아지|狗|كلب/
    .test(t)
  ){
    result.dog=true;
  }

  if(
    /cat|बिल्ली|gato|chat|katze|猫|고양이|قط/
    .test(t)
  ){
    result.cat=true;
  }

  if(
    /lion|शेर|leon|löwe|ライオン|사자|狮子|أسد/
    .test(t)
  ){
    result.lion=true;
  }

  if(
    /bird|पक्षी|चिड़िया|oiseau|pájaro|vogel|鳥|새|鸟|طائر/
    .test(t)
  ){
    result.bird=true;
  }

  if(
    /fight|attack|run|running|chase|battle|लड़ाई|दौड़|भाग|पीछा|हमला|युद्ध/
    .test(t)
  ){
    result.action=true;
  }

  if(
    /love|heart|friend|friendship|प्यार|प्रेम|दोस्त|दोस्ती|मोहब्बत/
    .test(t)
  ){
    result.love=true;
  }

  if(
    /rain|बारिश|वर्षा|बৃষ্টি|雨|비|مطر/
    .test(t)
  ){
    result.rain=true;
  }

  return result;
}


/* =========================
   AUDIO ENGINE
========================= */

function initAudio(){

  try{

    if(!audioCtx){

      audioCtx=new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

    }

    if(audioCtx.state==="suspended")
      audioCtx.resume();

  }catch(e){}

}


function tone(freq,duration=.18,type="sine",volume=.04){

  try{

    initAudio();

    const osc=audioCtx.createOscillator();
    const gain=audioCtx.createGain();

    osc.type=type;
    osc.frequency.value=freq;

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    gain.gain.setValueAtTime(
      .0001,
      audioCtx.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      volume,
      audioCtx.currentTime+.02
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      audioCtx.currentTime+duration
    );

    osc.start();

    osc.stop(
      audioCtx.currentTime+duration+.02
    );

  }catch(e){}

}


function sceneSound(info){

  if(info.action){

    tone(180,.12,"sawtooth",.035);
    setTimeout(
      ()=>tone(300,.14,"square",.03),
      120
    );

  }else if(info.rain){

    tone(700,.08,"triangle",.018);

  }else if(info.love){

    tone(523,.18,"sine",.03);

    setTimeout(
      ()=>tone(659,.2,"sine",.025),
      180
    );

  }else{

    tone(440,.12,"sine",.025);

  }

}


/* =========================
   SPEECH
========================= */

function speak(text){

  if(!("speechSynthesis" in window))
    return;

  window.speechSynthesis.cancel();

  const u=new SpeechSynthesisUtterance(text);

  u.lang=language.value;
  u.rate=.88;

  const voices=
    window.speechSynthesis.getVoices();

  const langCode=
    language.value.substring(0,2).toLowerCase();

  const matches=voices.filter(v=>
    v.lang.toLowerCase().startsWith(langCode)
  );

  if(matches.length){

    let chosen=matches[0];

    if(voiceType.value==="female"){

      const f=matches.find(v=>
        /female|zira|samantha|susan|google/i
        .test(v.name)
      );

      if(f) chosen=f;

    }

    if(voiceType.value==="male"){

      const m=matches.find(v=>
        /male|david|alex|daniel|mark|google/i
        .test(v.name)
      );

      if(m) chosen=m;

    }

    u.voice=chosen;

  }

  u.pitch=
    voiceType.value==="female" ? 1.15 : .95;

  window.speechSynthesis.speak(u);
}


/* =========================
   BACKGROUND
========================= */

function drawBackground(sceneIndex,time,info){

  const w=canvas.width;
  const h=canvas.height;

  let top="#172957";
  let bottom="#07101d";

  if(styleBox.value==="anime"){
    top="#40265d";
    bottom="#10162d";
  }

  if(styleBox.value==="2d"){
    top="#246080";
    bottom="#122535";
  }

  if(styleBox.value==="3d"){
    top="#17365c";
    bottom="#050a14";
  }

  if(info.rain){

    top="#18283d";
    bottom="#080d17";

  }

  const g=ctx.createLinearGradient(
    0,0,0,h
  );

  g.addColorStop(0,top);
  g.addColorStop(1,bottom);

  ctx.fillStyle=g;
  ctx.fillRect(0,0,w,h);


  /* stars */

  for(let i=0;i<80;i++){

    const x=
      (i*149+sceneIndex*31)%w;

    const y=
      (i*71)%390;

    ctx.fillStyle=
      "rgba(255,255,255,.65)";

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      1.7,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  /* moon */

  ctx.fillStyle="#fff1b0";

  ctx.beginPath();

  ctx.arc(
    w-150,
    120,
    55,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* city */

  ctx.fillStyle="#0c1724";
  ctx.fillRect(0,530,w,190);

  for(let i=0;i<16;i++){

    const bh=
      80+((i*43)%170);

    const x=i*90;

    ctx.fillStyle=
      i%2
      ? "#142438"
      : "#1a2b40";

    ctx.fillRect(
      x,
      530-bh,
      70,
      bh
    );

    for(let yy=545-bh;yy<515;yy+=28){

      ctx.fillStyle=
        "rgba(255,220,110,.55)";

      for(
        let xx=x+10;
        xx<x+60;
        xx+=23
      ){

        ctx.fillRect(
          xx,
          yy,
          8,
          11
        );

      }

    }

  }


  /* road */

  ctx.fillStyle="#121722";
  ctx.fillRect(0,610,w,110);

  ctx.strokeStyle="#5c6474";
  ctx.lineWidth=5;

  ctx.setLineDash([35,25]);

  ctx.beginPath();
  ctx.moveTo(0,665);
  ctx.lineTo(w,665);
  ctx.stroke();

  ctx.setLineDash([]);


  /* rain */

  if(info.rain){

    ctx.strokeStyle=
      "rgba(150,190,255,.45)";

    ctx.lineWidth=2;

    for(let i=0;i<180;i++){

      const x=
        (i*83+time*.35)%w;

      const y=
        (i*41+time*.8)%650;

      ctx.beginPath();

      ctx.moveTo(x,y);
      ctx.lineTo(x-8,y+22);

      ctx.stroke();

    }

  }

}


/* =========================
   HUMAN CHARACTER
========================= */

function drawHuman(
  x,
  groundY,
  female,
  walk,
  talking,
  expression,
  scale=1
){

  ctx.save();

  ctx.translate(x,groundY);
  ctx.scale(scale,scale);


  /* walking animation */

  const leg=Math.sin(walk)*24;
  const arm=Math.sin(walk+Math.PI)*20;


  /* shadow */

  ctx.fillStyle="rgba(0,0,0,.35)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    5,
    70,
    15,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* legs */

  ctx.strokeStyle="#202735";
  ctx.lineWidth=22;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.moveTo(-18,100);
  ctx.lineTo(-28+leg,165);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(18,100);
  ctx.lineTo(28-leg,165);
  ctx.stroke();


  /* shoes */

  ctx.strokeStyle="#080b10";
  ctx.lineWidth=17;

  ctx.beginPath();
  ctx.moveTo(-28+leg,165);
  ctx.lineTo(-52+leg,165);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(28-leg,165);
  ctx.lineTo(52-leg,165);
  ctx.stroke();


  /* body */

  ctx.fillStyle=
    female ? "#d64b9b" : "#3867d6";

  ctx.fillRect(
    -48,
    -5,
    96,
    120
  );


  /* arms */

  ctx.strokeStyle="#efbd98";
  ctx.lineWidth=19;

  ctx.beginPath();

  ctx.moveTo(-45,15);
  ctx.lineTo(
    -88-arm,
    65
  );

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(45,15);
  ctx.lineTo(
    88+arm,
    65
  );

  ctx.stroke();


  /* neck */

  ctx.fillStyle="#efbd98";

  ctx.fillRect(
    -16,
    -28,
    32,
    35
  );


  /* head */

  ctx.beginPath();

  ctx.arc(
    0,
    -70,
    52,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* hair */

  ctx.fillStyle=
    female ? "#351d29" : "#20242c";

  ctx.beginPath();

  ctx.arc(
    0,
    -83,
    50,
    Math.PI,
    Math.PI*2
  );

  ctx.fill();


  if(female){

    ctx.fillRect(
      -48,
      -83,
      15,
      65
    );

    ctx.fillRect(
      33,
      -83,
      15,
      65
    );

  }


  /* eyes */

  ctx.fillStyle="#111";

  ctx.beginPath();

  ctx.arc(
    -18,
    -70,
    5,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    18,
    -70,
    5,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* expression */

  ctx.strokeStyle="#111";
  ctx.lineWidth=3;

  ctx.beginPath();

  if(expression==="sad"){

    ctx.arc(
      0,
      -38,
      16,
      Math.PI,
      Math.PI*2
    );

  }else if(expression==="surprise"){

    ctx.arc(
      0,
      -40,
      8,
      0,
      Math.PI*2
    );

  }else{

    ctx.arc(
      0,
      -42,
      17,
      0,
      Math.PI
    );

  }

  ctx.stroke();


  /* talking mouth */

  if(talking){

    ctx.fillStyle="#350f16";

    ctx.beginPath();

    ctx.ellipse(
      0,
      -40,
      12,
      7+Math.abs(Math.sin(Date.now()/80))*8,
      0,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  ctx.restore();

}


/* =========================
   DOG
========================= */

function drawDog(x,y,move){

  ctx.save();

  ctx.translate(x,y);

  const bounce=
    Math.sin(move)*7;

  ctx.translate(0,bounce);


  /* shadow */

  ctx.fillStyle="rgba(0,0,0,.3)";

  ctx.beginPath();

  ctx.ellipse(
    0,
    55,
    95,
    14,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* body */

  ctx.fillStyle="#a96c38";

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    95,
    55,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* head */

  ctx.beginPath();

  ctx.arc(
    -75,
    -35,
    55,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* ears */

  ctx.fillStyle="#70411f";

  ctx.beginPath();

  ctx.moveTo(-110,-70);
  ctx.lineTo(-145,-125);
  ctx.lineTo(-75,-90);

  ctx.fill();

  ctx.beginPath();

  ctx.moveTo(-45,-75);
  ctx.lineTo(-20,-125);
  ctx.lineTo(-10,-60);

  ctx.fill();


  /* eye */

  ctx.fillStyle="#111";

  ctx.beginPath();

  ctx.arc(
    -95,
    -45,
    7,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* nose */

  ctx.beginPath();

  ctx.arc(
    -128,
    -35,
    9,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* legs */

  ctx.strokeStyle="#77491f";
  ctx.lineWidth=16;
  ctx.lineCap="round";

  const leg=Math.sin(move)*15;

  ctx.beginPath();
  ctx.moveTo(-45,35);
  ctx.lineTo(-50+leg,75);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(35,35);
  ctx.lineTo(40-leg,75);
  ctx.stroke();


  /* tail */

  ctx.strokeStyle="#a96c38";
  ctx.lineWidth=18;

  ctx.beginPath();

  ctx.arc(
    100,
    -30,
    55,
    -1,
    1
  );

  ctx.stroke();


  ctx.restore();

}


/* =========================
   CAT
========================= */

function drawCat(x,y,move){

  ctx.save();

  ctx.translate(x,y);

  const jump=Math.abs(Math.sin(move))*12;

  ctx.translate(0,-jump);


  ctx.fillStyle="#b9b0a7";

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    60,
    40,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.arc(
    -48,
    -35,
    38,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.moveTo(-75,-55);
  ctx.lineTo(-68,-100);
  ctx.lineTo(-45,-65);
  ctx.fill();

  ctx.beginPath();

  ctx.moveTo(-25,-65);
  ctx.lineTo(0,-100);
  ctx.lineTo(2,-50);
  ctx.fill();


  ctx.fillStyle="#111";

  ctx.beginPath();

  ctx.arc(-60,-40,5,0,Math.PI*2);
  ctx.fill();

  ctx.restore();

}


/* =========================
   LION
========================= */

function drawLion(x,y,move){

  ctx.save();

  ctx.translate(x,y);

  const b=Math.sin(move)*5;

  ctx.translate(0,b);

  ctx.fillStyle="#9b632e";

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    100,
    55,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle="#d8903e";

  ctx.beginPath();

  ctx.arc(
    -80,
    -40,
    65,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle="#6b3c1e";

  ctx.beginPath();

  ctx.arc(
    -80,
    -40,
    50,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle="#d8903e";

  ctx.beginPath();

  ctx.arc(
    -80,
    -40,
    38,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.fillStyle="#111";

  ctx.beginPath();

  ctx.arc(-95,-45,6,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();

  ctx.arc(-65,-45,6,0,Math.PI*2);
  ctx.fill();

  ctx.restore();

}


/* =========================
   BIRD
========================= */

function drawBird(x,y,move){

  ctx.save();

  ctx.translate(x,y);

  const wing=
    Math.sin(move*2)*25;

  ctx.fillStyle="#55a8e8";

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    40,
    25,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.strokeStyle="#3478b1";
  ctx.lineWidth=12;

  ctx.beginPath();

  ctx.moveTo(0,0);
  ctx.lineTo(-35,wing);

  ctx.stroke();

  ctx.beginPath();

  ctx.moveTo(0,0);
  ctx.lineTo(35,-wing);

  ctx.stroke();


  ctx.restore();

}


/* =========================
   TEXT
========================= */

function wrapText(text,maxWidth){

  const words=text.split(/\s+/);
  const lines=[];
  let line="";

  for(const word of words){

    const test=
      line
      ? line+" "+word
      : word;

    if(
      ctx.measureText(test).width >
      maxWidth
    ){

      if(line)
        lines.push(line);

      line=word;

    }else{

      line=test;

    }

  }

  if(line)
    lines.push(line);

  return lines.slice(0,4);

}


/* =========================
   SCENE DRAWING
========================= */

function drawScene(
  text,
  index,
  total,
  elapsed
){

  const info=
    detectCharacters(text);

  const t=elapsed/1000;

  drawBackground(
    index,
    elapsed,
    info
  );


  /* camera movement */

  const zoom=
    1+
    Math.sin(t*.7)*.035;

  const cameraX=
    Math.sin(t*.45)*18;


  ctx.save();

  ctx.translate(
    canvas.width/2+cameraX,
    500
  );

  ctx.scale(zoom,zoom);

  ctx.translate(
    -canvas.width/2,
    -500
  );


  /* main character */

  const walk=t*5;

  let expression="happy";

  if(info.action)
    expression="surprise";

  if(info.rain)
    expression="sad";


  const personX=
    canvas.width/2-190+
    Math.sin(t*.7)*65;


  const talking=
    Math.floor(t*4)%2===0;


  drawHuman(
    personX,
    430+
    Math.sin(t*3)*4,
    info.female,
    walk,
    talking,
    expression,
    1.05
  );


  /* second character for friendship/love/action */

  if(info.love || info.action){

    drawHuman(
      canvas.width/2+160+
      Math.sin(t*.8)*45,
      430,
      !info.female,
      walk+2,
      Math.floor(t*4)%2===0,
      info.love ? "happy":"surprise",
      .95
    );

  }


  /* animals */

  if(info.dog){

    drawDog(
      canvas.width/2+330+
      Math.sin(t)*80,
      470,
      walk
    );

  }

  if(info.cat){

    drawCat(
      canvas.width/2+320+
      Math.sin(t*.8)*70,
      480,
      walk
    );

  }

  if(info.lion){

    drawLion(
      canvas.width/2+300+
      Math.sin(t*.6)*70,
      455,
      walk
    );

  }

  if(info.bird){

    drawBird(
      canvas.width/2+
      Math.sin(t)*250,
      190+
      Math.sin(t*2)*40,
      walk
    );

  }

  ctx.restore();


  /* cinematic top/bottom bars */

  ctx.fillStyle="rgba(0,0,0,.42)";
  ctx.fillRect(0,0,canvas.width,55);
  ctx.fillRect(0,665,canvas.width,55);


  /* scene title */

  ctx.fillStyle="#fff";
  ctx.font="bold 25px Arial";

  ctx.fillText(
    "SCENE "+(index+1)+" / "+total,
    35,
    37
  );


  /* story subtitle */

  ctx.fillStyle="rgba(0,0,0,.72)";

  ctx.fillRect(
    50,
    555,
    1180,
    100
  );

  ctx.fillStyle="#fff";
  ctx.font="25px Arial";

  const lines=
    wrapText(
      text,
      1080
    );

  lines.forEach(
    (line,i)=>{
      ctx.fillText(
        line,
        90,
        595+i*30
      );
    }
  );


  /* action flash */

  if(info.action){

    const flash=
      Math.max(
        0,
        Math.sin(t*8)
      )*.08;

    ctx.fillStyle=
      "rgba(255,80,50,"+
      flash+
      ")";

    ctx.fillRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

  }

}


/* =========================
   SHOW SCENES
========================= */

function showScenes(scenes){

  scenesBox.innerHTML="";

  scenes.forEach(
    (scene,i)=>{

      const info=
        detectCharacters(scene);

      const div=
        document.createElement("div");

      div.className="scene";

      let badges="";

      if(info.human)
        badges+='<span class="badge">👤 Human</span>';

      if(info.female)
        badges+='<span class="badge">👩 Female</span>';

      if(info.dog)
        badges+='<span class="badge">🐕 Dog</span>';

      if(info.cat)
        badges+='<span class="badge">🐈 Cat</span>';

      if(info.lion)
        badges+='<span class="badge">🦁 Lion</span>';

      if(info.bird)
        badges+='<span class="badge">🐦 Bird</span>';

      if(info.action)
        badges+='<span class="badge">⚔️ Action</span>';

      if(info.love)
        badges+='<span class="badge">❤️ Emotion</span>';

      div.innerHTML=
        "<b>Scene "+(i+1)+"</b><br>"+
        scene+
        "<br>"+badges;

      scenesBox.appendChild(div);

    }
  );

}


/* =========================
   CREATE MOVIE
========================= */

async function createMovie(){

  const story=
    storyBox.value.trim();

  if(!story){

    alert(
      "पहले अपनी कहानी paste करें।"
    );

    return;

  }


  const scenes=
    makeScenes(story);

  if(!scenes.length){

    alert("कहानी नहीं मिली।");
    return;

  }


  showScenes(scenes);


  running=true;
  stopRequested=false;

  createBtn.disabled=true;
  stopBtn.disabled=false;

  downloadBtn.style.display="none";

  recordedChunks=[];

  bar.style.width="0%";

  statusBox.innerText=
    "🎬 Preparing movie...";


  initAudio();
  tone(660,.25,"sine",.05);


  const stream=
    canvas.captureStream(30);


  let mime="video/webm";


  if(
    MediaRecorder.isTypeSupported(
      "video/webm;codecs=vp9,opus"
    )
  ){

    mime=
      "video/webm;codecs=vp9,opus";

  }


  if(
    !window.MediaRecorder
  ){

    alert(
      "इस browser में video recording support नहीं है।"
    );

    running=false;
    createBtn.disabled=false;
    stopBtn.disabled=true;

    return;

  }


  mediaRecorder=
    new MediaRecorder(
      stream,
      {mimeType:mime}
    );


  mediaRecorder.ondataavailable=e=>{

    if(
      e.data &&
      e.data.size>0
    ){

      recordedChunks.push(e.data);

    }

  };


  mediaRecorder.onstop=()=>{

    const blob=
      new Blob(
        recordedChunks,
        {type:mime}
      );


    const url=
      URL.createObjectURL(blob);


    downloadBtn.style.display="block";


    downloadBtn.onclick=()=>{

      const a=
        document.createElement("a");

      a.href=url;

      a.download=
        "AI-Cartoon-Movie.webm";

      document.body.appendChild(a);

      a.click();

      a.remove();

    };


    statusBox.innerText=
      "🎉 Movie Ready! Download दबाएँ।";

    bar.style.width="100%";

  };


  mediaRecorder.start();


  const duration=
    Number(durationBox.value);


  const sceneTime=
    Math.max(
      3000,
      (duration*1000)/
      scenes.length
    );


  const totalMovieTime=
    scenes.length*
    sceneTime;


  for(
    let i=0;
    i<scenes.length;
    i++
  ){

    if(stopRequested)
      break;


    activeScene=i;


    const scene=
      scenes[i];

    const info=
      detectCharacters(scene);


    statusBox.innerText=
      "🎬 Scene "+
      (i+1)+
      " / "+
      scenes.length;


    sceneSound(info);

    speak(scene);


    const start=
      performance.now();


    while(
      performance.now()-
      start<
      sceneTime
    ){

      if(stopRequested)
        break;


      const now=
        performance.now();

      const local=
        now-start;


      drawScene(
        scene,
        i,
        scenes.length,
        local
      );


      const elapsed=
        i*sceneTime+
        local;


      const percent=
        Math.min(
          99,
          elapsed/
          totalMovieTime*
          100
        );


      bar.style.width=
        percent+"%";


      await new Promise(
        r=>
          requestAnimationFrame(r)
      );

    }

  }


  window.speechSynthesis.cancel();


  if(!stopRequested){

    statusBox.innerText=
      "✨ Finishing movie...";


    const finish=
      performance.now();


    while(
      performance.now()-
      finish<1200
    ){

      drawScene(
        scenes[scenes.length-1],
        scenes.length-1,
        scenes.length,
        performance.now()
      );


      await new Promise(
        r=>
          requestAnimationFrame(r)
      );

    }


    tone(
      880,
      .35,
      "sine",
      .05
    );

  }


  if(
    mediaRecorder &&
    mediaRecorder.state!=="inactive"
  ){

    mediaRecorder.stop();

  }


  running=false;

  createBtn.disabled=false;
  stopBtn.disabled=true;

}


/* =========================
   STOP
========================= */

stopBtn.onclick=()=>{

  if(!running)
    return;

  stopRequested=true;

  window.speechSynthesis.cancel();

  statusBox.innerText=
    "⛔ Stopping movie...";

};


/* =========================
   CREATE BUTTON
========================= */

createBtn.onclick=()=>{

  createMovie();

};


/* =========================
   FIRST SCREEN
========================= */

drawBackground(
  0,
  0,
  {
    human:true,
    female:false,
    dog:false,
    cat:false,
    lion:false,
    bird:false,
    action:false,
    love:false,
    rain:false
  }
);

ctx.fillStyle="#fff";

ctx.textAlign="center";

ctx.font="bold 48px Arial";

ctx.fillText(
  "AI CARTOON MOVIE",
  canvas.width/2,
  330
);

ctx.font="28px Arial";

ctx.fillText(
  "Paste Story → Create Movie",
  canvas.width/2,
  390
);

ctx.textAlign="left";


/* browser voices */

if(
  "speechSynthesis" in window
){

  window.speechSynthesis.onvoiceschanged=
    ()=>{
      window.speechSynthesis.getVoices();
    };

}

</script>
